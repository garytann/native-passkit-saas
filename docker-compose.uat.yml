services:
  db:
    extends:
      file: docker-compose.common.yml
      service: db

  db-init:
    extends:
      file: docker-compose.common.yml
      service: db-init

  db-migrate:
    extends:
      file: docker-compose.common.yml
      service: db-migrate

  backend:
    extends:
      file: docker-compose.common.yml
      service: backend

  web:
    extends:
      file: docker-compose.common.yml
      service: web

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - web
    ports:
      - "${PROXY_HOST_PORT:-80}:80"
      - "${PROXY_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./proxy/nginx.uat.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/certs:/etc/nginx/ssl:ro

volumes:
  postgres_data:
