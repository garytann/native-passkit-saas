services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: passkit_wip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d passkit_wip"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/passkit_wip?sslmode=disable
      AUTH_TOKEN_SECRET: change-me-for-local-dev
      APPLE_PASS_TYPE_ID: pass.com.sagaloyalty.loyalty
      APPLE_TEAM_ID: FVNA87HWN5
      APPLE_ORGANIZATION_NAME: Example Company
      APPLE_WEB_SERVICE_URL: ""
      APPLE_PASS_CERT_PATH: certs/pass-cert.pem
      APPLE_PASS_KEY_PATH: certs/pass-key.pem
      APPLE_WWDR_CERT_PATH: certs/wwdr.pem
      OPENSSL_BIN: openssl
    volumes:
      - ./certs:/app/certs:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
