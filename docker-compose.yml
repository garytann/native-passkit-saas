services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      APPLE_PASS_TYPE_ID: ${APPLE_PASS_TYPE_ID:?APPLE_PASS_TYPE_ID is required}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}
      APPLE_ORGANIZATION_NAME: ${APPLE_ORGANIZATION_NAME:?APPLE_ORGANIZATION_NAME is required}
      APPLE_WEB_SERVICE_URL: ${APPLE_WEB_SERVICE_URL:-}
      APPLE_PASS_CERT_PATH: ${APPLE_PASS_CERT_PATH:-certs/pass-cert.pem}
      APPLE_PASS_KEY_PATH: ${APPLE_PASS_KEY_PATH:-certs/pass-key.pem}
      APPLE_WWDR_CERT_PATH: ${APPLE_WWDR_CERT_PATH:-certs/wwdr.pem}
      OPENSSL_BIN: ${OPENSSL_BIN:-openssl}
    volumes:
      - ./certs:/app/certs:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - web
    ports:
      - "${PROXY_HOST_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
