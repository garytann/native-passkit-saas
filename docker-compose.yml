services:
  db:
    extends:
      file: docker-compose.common.yml
      service: db

  db-init:
    extends:
      file: docker-compose.common.yml
      service: db-init

  db-migrate:
    extends:
      file: docker-compose.common.yml
      service: db-migrate

  backend:
    extends:
      file: docker-compose.common.yml
      service: backend

  web:
    extends:
      file: docker-compose.common.yml
      service: web

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - web
      - landing
    ports:
      - "${PROXY_HOST_PORT:-80}:80"
      - "${PROXY_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./proxy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/certs:/etc/nginx/ssl:ro

  google-wallet-assets:
    image: nginx:1.27-alpine
    profiles:
      - local-google-wallet
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${GOOGLE_WALLET_ASSET_HOST_PORT:-18081}:80"
    volumes:
      - ./proxy/nginx.google-wallet-assets.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:

secrets:
  google_wallet_service_account:
    file: ${GOOGLE_WALLET_CREDENTIALS_FILE:-./google-credentials/disabled.json}
